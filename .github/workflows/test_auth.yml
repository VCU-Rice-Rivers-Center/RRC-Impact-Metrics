name: Test GCP Auth

on:
  workflow_dispatch: 

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install googlesheets4
        run: Rscript -e 'install.packages("googlesheets4", "dplyr", "tidyr", "lubridate", "strex", "knitr")'

      - name: Run Auth Check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: Rscript impactMetrics.R
